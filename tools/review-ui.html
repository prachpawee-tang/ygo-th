<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ygo-th ตรวจคำแปล</title>
<style>
  :root { --bg: #15171f; --panel: #1d2029; --line: #333849; --text: #eee; --muted: #9aa0b0; --gold: #c9a227; --ok: #8ee08e; --bad: #ff8a80; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: #101219; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 12px 0 0; font-size: 16px; color: var(--gold); }
  select, input[type=search] { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 4px; padding: 4px 6px; font: inherit; font-size: 13px; }
  #count { margin-left: auto; font-size: 13px; color: var(--muted); }
  main { max-width: 1200px; margin: 0 auto; padding: 16px; }
  .title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px; margin-bottom: 8px; }
  .title h2 { margin: 0; font-size: 20px; }
  .meta { color: var(--muted); font-size: 13px; }
  .problems { margin: 0 0 12px; padding: 8px 12px; border-left: 3px solid var(--bad); background: rgba(255,138,128,.08); font-size: 13px; }
  .problems:empty { display: none; }
  .problems div::before { content: "⚠ "; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 800px) { .cols { grid-template-columns: 1fr; } }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
  .box h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .03em; }
  .text { white-space: pre-wrap; overflow-wrap: anywhere; }
  textarea { width: 100%; min-height: 160px; margin-top: 12px; background: #11131a; color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 10px; font: inherit; resize: vertical; }
  textarea.changed { border-color: var(--gold); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  button { padding: 7px 14px; border: 1px solid var(--line); border-radius: 4px; background: #2a2e3b; color: var(--text); font: inherit; font-size: 14px; cursor: pointer; }
  button.primary { background: var(--gold); color: #111; border-color: var(--gold); font-weight: 600; }
  button:disabled { opacity: .5; cursor: default; }
  kbd { font-size: 11px; opacity: .7; margin-left: 4px; }
  #msg { font-size: 13px; }
  .err { color: var(--bad); } .good { color: var(--ok); }
  .empty { text-align: center; color: var(--muted); padding: 60px 0; }
  /* diff แบบ VS Code: ส่วนที่ลบ = แดง (ฝั่งเดิม) · ส่วนที่เพิ่ม = เขียว (ฝั่งใหม่) */
  .diff-del { background: rgba(255, 85, 85, .30); border-radius: 2px; }
  .diff-ins { background: rgba(80, 200, 120, .30); border-radius: 2px; }
  .diff-row .box h3 .meta { font-weight: 400; margin-left: 6px; }
  .live-rule { font-size: 12px; margin-top: 6px; color: var(--muted); }
  /* สีชุดเดียวกับ extension / Dueling Nexus */
  .ygot-block { display: block; } .ygot-block + .ygot-block { margin-top: 10px; }
  .ygot-cond { color: #F1FA8C; font-weight: 500; } .ygot-cost { color: #FF79C6; font-weight: 500; } .ygot-summon { color: #8BE9FD; font-weight: 500; }
  .ygot-name { font-style: italic; } .ygot-limit { text-decoration: underline; } .ygot-quick { font-weight: bold; }
</style>
</head>
<body>
<header>
  <h1>🇹🇭 ตรวจคำแปล</h1>
  <select id="mode" title="ชุดการ์ดที่จะตรวจ" aria-label="ชุดการ์ดที่จะตรวจ">
    <option value="notes">ใบที่ rule-check สงสัย (มี note)</option>
    <option value="ai">ทุกใบที่ยังเป็น AI</option>
    <option value="form">คำแก้จาก Google Form</option>
  </select>
  <select id="kind" title="กรองตามชนิดปัญหา" aria-label="กรองตามชนิดปัญหา">
    <option value="">ปัญหาทุกแบบ</option>
    <option value="banish">banish ↔ ออกจากเกม</option>
    <option value="face">face-up/down ↔ หงาย/คว่ำ</option>
    <option value="number">ตัวเลขหาย</option>
    <option value="colon">":" หาย</option>
    <option value="semicolon">";" หาย</option>
    <option value="name">ชื่อการ์ด</option>
    <option value="bullet">●</option>
    <option value="other">อื่น ๆ</option>
    <option value="ai-accept">ฟอร์ม: AI ผ่าน</option>
    <option value="ai-reject">ฟอร์ม: AI ไม่ผ่าน</option>
    <option value="ai-needs-human">ฟอร์ม: AI ให้คนดู</option>
    <option value="ai-none">ฟอร์ม: ยังไม่ได้ให้ AI ตรวจ</option>
  </select>
  <input id="q" type="search" placeholder="ค้นชื่อการ์ด / passcode" aria-label="ค้นชื่อการ์ดหรือ passcode">
  <span id="count">กำลังโหลด…</span>
</header>
<main id="main"><div class="empty">กำลังโหลด…</div></main>

<script src="/format.js"></script>
<script>
const TOKEN = new URLSearchParams(location.search).get("t") || "";
history.replaceState(null, "", "/?t=" + TOKEN); // คง token ไว้ แต่ล้างพารามิเตอร์อื่น
const $ = id => document.getElementById(id);
const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); e.append(...kids); return e; };
const api = (path, opts = {}) => fetch(path, { ...opts, headers: { "x-review-token": TOKEN, ...(opts.headers || {}) } })
  .then(r => r.json())
  .catch(() => ({ ok: false, error: "ติดต่อเซิร์ฟเวอร์ไม่ได้ — หน้าต่าง review-ui ถูกปิดไปแล้ว? เปิด review-ui.bat ใหม่" }));

let all = [], list = [], pos = 0, done = 0;

// แสดงข้อความด้วย formatter เดียวกับ extension (สร้าง DOM ด้วย textContent เท่านั้น)
const CLS = { cond: "ygot-cond", cost: "ygot-cost", summon: "ygot-summon", name: "ygot-name", limit: "ygot-limit", quick: "ygot-quick" };
function render(target, text) {
  target.textContent = "";
  let blocks = null;
  try { blocks = globalThis.ygotFormatThai(text); } catch {}
  if (!blocks?.length) { target.textContent = text; return; }
  for (const b of blocks) {
    const d = el("span", { className: "ygot-block" });
    for (const s of b.segs) d.append(s.cls.length ? el("span", { className: s.cls.map(c => CLS[c]).join(" "), textContent: s.text }) : document.createTextNode(s.text));
    target.append(d);
  }
}

async function load() {
  $("count").textContent = "กำลังโหลด…";
  const r = await api("/api/queue?mode=" + $("mode").value);
  if (!r.ok) { $("main").replaceChildren(el("div", { className: "empty err", textContent: r.error || "โหลดไม่ได้" })); return; }
  if (r.note && !r.items.length) { $("count").textContent = ""; $("main").replaceChildren(el("div", { className: "empty", textContent: r.note })); return; }
  all = r.items; applyFilter();
}

function applyFilter() {
  const k = $("kind").value, q = $("q").value.trim().toLowerCase();
  list = all.filter(c => (!k || c.kinds.includes(k)) && (!q || c.name.toLowerCase().includes(q) || c.id.includes(q)));
  pos = 0; show();
}

function show() {
  $("count").textContent = list.length ? `${pos + 1} / ${list.length} · ตรวจแล้วรอบนี้ ${done}` : `ไม่มีใบให้ตรวจ · ตรวจแล้วรอบนี้ ${done}`;
  const c = list[pos];
  if (!c) { $("main").replaceChildren(el("div", { className: "empty", textContent: done ? "หมดแล้ว 🎉 ปิดหน้านี้แล้วรัน tools\\update-data.bat เพื่อส่งขึ้น GitHub" : "ไม่มีใบที่ตรงกับตัวกรอง" })); return; }

  // คำแก้จากฟอร์ม: กล่องแก้เริ่มจากคำที่คนส่งมา และแสดงคำแปลปัจจุบันไว้เทียบ
  const isForm = !!c.formKey;
  const base = isForm ? c.proposed : c.th;
  const enBox = el("div", { className: "text" }); render(enBox, c.en);
  const thBox = el("div", { className: "text" }); render(thBox, base);
  const ta = el("textarea", { value: base, spellcheck: false, ariaLabel: "แก้คำแปล" });
  const live = el("div", { className: "live-rule" });
  // เดิม | ใหม่ ข้างกัน พร้อมไฮไลต์ส่วนที่ต่าง (อัปเดตทุกครั้งที่พิมพ์)
  const oldBox = el("div", { className: "text" }), newBox = el("div", { className: "text" });
  const oldStat = el("span", { className: "meta" }), newStat = el("span", { className: "meta" });
  const diffRow = el("div", { className: "cols diff-row", style: "margin-top:12px" },
    el("div", { className: "box" }, el("h3", {}, "คำแปลปัจจุบัน", oldStat), oldBox),
    el("div", { className: "box" }, el("h3", {}, isForm ? "คำแก้ (ในกล่องด้านล่าง)" : "ที่แก้ (ในกล่องด้านล่าง)", newStat), newBox));
  const updDiff = () => {
    const visible = isForm || ta.value.trim() !== c.th.trim();
    diffRow.style.display = visible ? "" : "none";
    if (!visible) return;
    const { del, ins } = renderDiff(oldBox, newBox, c.th || "", ta.value);
    oldStat.textContent = del ? `− ${del} คำ` : "ไม่มีส่วนที่ลบ";
    newStat.textContent = ins ? `+ ${ins} คำ` : (del ? "ไม่มีส่วนที่เพิ่ม" : "เหมือนเดิม");
  };
  const msg = el("span", { id: "msg" });
  const btnOk = el("button", { className: "primary", title: "Ctrl+Enter" }, isForm ? "✓ ใช้คำแก้นี้" : "✓ ถูกแล้ว", el("kbd", { textContent: "Ctrl+Enter" }));
  const btnDismiss = el("button", { title: "ไม่ใช้คำแก้นี้ (การ์ดไม่เปลี่ยน)" }, "✗ ไม่ใช้");
  const btnSave = el("button", { disabled: true, title: "Ctrl+S" }, "💾 บันทึกที่แก้", el("kbd", { textContent: "Ctrl+S" }));
  const btnSkip = el("button", { title: "Alt+→" }, "ข้าม →", el("kbd", { textContent: "Alt+→" }));
  const btnBack = el("button", { title: "Alt+←", disabled: pos === 0 }, "← ย้อน", el("kbd", { textContent: "Alt+←" }));

  ta.addEventListener("input", () => {
    const changed = ta.value.trim() !== base.trim();
    ta.classList.toggle("changed", changed);
    btnSave.disabled = !changed;
    render(thBox, ta.value);
    updDiff();
    live.textContent = changed ? "ตัวอย่างด้านบนอัปเดตตามที่แก้ · กด Ctrl+S เพื่อบันทึก" : "";
  });

  async function save(action) {
    btnOk.disabled = btnSave.disabled = true;
    msg.className = ""; msg.textContent = "กำลังบันทึก…";
    const r = await api("/api/save", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: c.id, th: ta.value, action, formKey: c.formKey, credit: c.credit }) });
    if (!r.ok) { msg.className = "err"; msg.textContent = r.error; btnOk.disabled = false; btnSave.disabled = ta.value.trim() === base.trim(); return; }
    done++;
    all = all.filter(x => x !== c); list.splice(pos, 1);
    if (pos >= list.length) pos = Math.max(0, list.length - 1);
    show();
    if (r.rule?.length) { const m = $("msg"); if (m) { m.className = "err"; m.textContent = `บันทึก ${c.name} แล้ว (rule-check ยังเตือน: ${r.rule.join(" · ")})`; } }
  }
  // ✓ saves what is in the box: if it was edited, the edit wins (same as Ctrl+Enter)
  const edited = () => ta.value.trim() !== base.trim();
  const leave = () => !edited() || confirm("ยังไม่ได้บันทึกที่แก้ไว้ — ทิ้งแล้วไปใบอื่น?");
  // คำแก้จากฟอร์ม: ใช้ข้อความในกล่องเสมอ (คือคำที่เขาส่งมา หรือที่ผู้ดูแลปรับต่อ)
  btnOk.onclick = () => save(isForm || edited() ? "edit" : "accept");
  btnDismiss.onclick = () => confirm("ไม่ใช้คำแก้นี้? (การ์ดไม่เปลี่ยน และจะไม่ขึ้นในคิวอีก)") && save("dismiss");
  btnSave.onclick = () => save("edit");
  btnSkip.onclick = () => { if (pos < list.length - 1 && leave()) { pos++; show(); } };
  btnBack.onclick = () => { if (pos > 0 && leave()) { pos--; show(); } };
  current = { ok: () => !btnOk.disabled && btnOk.onclick(), save: () => !btnSave.disabled && save("edit"), skip: btnSkip.onclick, back: btnBack.onclick };

  updDiff();
  const flags = [c.status === "ai" ? "🤖 AI" : c.status, `ยอดดู ${c.views.toLocaleString()}`, c.type, c.stale ? "⚠ ข้อความอังกฤษเปลี่ยนจากตอนแปล" : ""].filter(Boolean).join(" · ");
  $("main").replaceChildren(
    el("div", { className: "title" }, el("h2", { textContent: c.name }), el("span", { className: "meta", textContent: `#${c.id} · ${flags}` })),
    el("div", { className: "problems" }, ...c.problems.map(p => el("div", { textContent: p }))),
    el("div", { className: "cols" },
      el("div", { className: "box" }, el("h3", { textContent: "ENGLISH" }), enBox),
      el("div", { className: "box" }, el("h3", { textContent: isForm ? "คำแก้ที่ส่งมา (แสดงแบบเดียวกับใน extension)" : "ไทย (แสดงแบบเดียวกับใน extension)" }), thBox)),
    diffRow,
    ...(isForm ? [formInfo(c)] : []),
    ta, live,
    el("div", { className: "actions" }, btnOk, btnSave, ...(isForm ? [btnDismiss] : []), btnBack, btnSkip, msg)
  );
}

// ---- diff ระดับคำ (ภาษาไทยไม่มีช่องว่างระหว่างคำ → ตัดคำด้วย Intl.Segmenter) ----
const SEG = typeof Intl.Segmenter === "function" ? new Intl.Segmenter("th", { granularity: "word" }) : null;
const tokens = s => SEG ? [...SEG.segment(String(s))].map(x => x.segment) : [...String(s)];
/** LCS → [{t, op: "same" | "del" | "ins"}] · ข้อความยาวมาก (เกิน ~4 ล้านช่อง) เทียบทีละบรรทัดแทน */
function diffTokens(a, b) {
  if (a.length * b.length > 4e6) return diffTokens(a.join("").split(/(?<=\n)/), b.join("").split(/(?<=\n)/));
  const n = a.length, m = b.length, L = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < n && j < m) {
    if (a[i] === b[j]) { out.push({ t: a[i], op: "same" }); i++; j++; }
    else if (L[i + 1][j] >= L[i][j + 1]) out.push({ t: a[i++], op: "del" });
    else out.push({ t: b[j++], op: "ins" });
  }
  while (i < n) out.push({ t: a[i++], op: "del" });
  while (j < m) out.push({ t: b[j++], op: "ins" });
  return out;
}
/** เติมกล่องซ้าย (เดิม) และขวา (ใหม่) — สร้างด้วย textContent เท่านั้น · คืนจำนวนคำที่ลบ/เพิ่ม */
function renderDiff(oldBox, newBox, a, b) {
  oldBox.textContent = ""; newBox.textContent = "";
  let del = 0, ins = 0;
  for (const d of diffTokens(tokens(a), tokens(b))) {
    const piece = cls => d.t.trim() ? el("span", { className: cls, textContent: d.t }) : document.createTextNode(d.t);
    if (d.op === "same") { oldBox.append(document.createTextNode(d.t)); newBox.append(document.createTextNode(d.t)); }
    else if (d.op === "del") { oldBox.append(piece("diff-del")); if (d.t.trim()) del++; }
    else { newBox.append(piece("diff-ins")); if (d.t.trim()) ins++; }
  }
  return { del, ins };
}

// ข้อมูลจากฟอร์ม (ข้อความจากคนทั่วไป — แสดงด้วย textContent เท่านั้น)
function formInfo(c) {
  const row = (k, v) => v ? el("div", {}, el("b", { textContent: k + ": " }), document.createTextNode(v)) : "";
  return el("div", { className: "cols", style: "margin-top:12px" },
    el("div", { className: "box" }, el("h3", { textContent: "จากแบบฟอร์ม" }),
      row("ส่งเมื่อ", c.submitted), row("เหตุผล", c.reason), row("แหล่งอ้างอิง", c.source), row("เครดิต (แสดงใน extension)", c.credit)),
    aiInfo(c.ai));
}

// ผล AI จาก review-all.bat (คำแนะนำ — ผู้ดูแลตัดสินเอง) · ข้อความจาก AI แสดงด้วย textContent เท่านั้น
const AI_LABEL = { "ai-accept": ["✓ AI ผ่าน", "good"], "ai-reject": ["✗ AI ไม่ผ่าน", "err"], "ai-needs-human": ["? AI ให้คนดู", ""], invalid: ["✗ รูปแบบใช้ไม่ได้", "err"] };
function aiInfo(a) {
  const box = el("div", { className: "box", style: "grid-column: 1 / -1" }, el("h3", { textContent: "ผลตรวจ AI" }));
  if (!a) { box.append(el("div", { className: "meta", textContent: "ยังไม่ได้ตรวจ — รัน tools\\review-all.bat แล้วเปิดโหมดนี้ใหม่" })); return box; }
  const [t, cls] = AI_LABEL[a.label] || [a.label, ""];
  box.append(el("div", { className: cls, textContent: `${t} · ${a.model || ""} · ${(a.at || "").slice(0, 16).replace("T", " ")}` }));
  a.rounds?.forEach((r, i) => box.append(el("div", { textContent: `รอบ ${i + 1}: ${r.verdict} (มั่นใจ ${Math.round(r.confidence * 100)}%)${r.problems.length ? " — " + r.problems.join(" · ") : ""}` })));
  if (a.rounds?.[0]?.back_translation) box.append(el("details", {}, el("summary", { textContent: "คำแปลกลับเป็นภาษาอังกฤษ (รอบ 1)" }), el("div", { className: "text meta", textContent: a.rounds[0].back_translation })));
  return box;
}

let current = null;
document.addEventListener("keydown", e => {
  if (!current) return;
  if (e.ctrlKey && e.key === "Enter") { e.preventDefault(); current.ok(); }
  else if (e.ctrlKey && (e.key === "s" || e.key === "S")) { e.preventDefault(); current.save(); }
  else if (e.altKey && e.key === "ArrowRight") { e.preventDefault(); current.skip(); }
  else if (e.altKey && e.key === "ArrowLeft") { e.preventDefault(); current.back(); }
});
$("mode").onchange = load;
$("kind").onchange = applyFilter;
$("q").oninput = applyFilter;
load();
</script>
</body>
</html>
