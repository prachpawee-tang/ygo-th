<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<style>
  body { width: 300px; margin: 0; padding: 12px; font: 13px "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif; background: #15171f; color: #eee; }
  h1 { font-size: 15px; margin: 0 0 10px; color: #c9a227; }
  label { display: block; margin: 8px 0 3px; font-size: 12px; opacity: .85; }
  select { width: 100%; box-sizing: border-box; padding: 5px 6px; background: #222531; color: #eee; border: 1px solid #3a3e4d; border-radius: 4px; }
  .check { display: flex; align-items: center; gap: 6px; margin: 0; }
  button { width: 100%; margin-top: 10px; padding: 6px; border: 0; border-radius: 4px; background: #c9a227; color: #111; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: default; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 10px 0 0; font-size: 12px; }
  dt { opacity: .65; } dd { margin: 0; }
  #msg { margin-top: 8px; font-size: 12px; white-space: pre-wrap; min-height: 1em; }
  .err { color: #ff8a80; }
  footer { margin-top: 10px; font-size: 11px; opacity: .6; }
  a { color: #c9a227; }
</style>
</head>
<body>
  <h1>🇹🇭 ygo-th คำแปลการ์ด</h1>
  <label class="check"><input type="checkbox" id="enabled"> เปิดใช้งาน</label>
  <label for="displayMode">การแสดงผล</label>
  <select id="displayMode">
    <option value="replace">เขียนทับข้อความ (คลิกเพื่อสลับ ไทย/EN)</option>
    <option value="below">แสดงใต้ข้อความภาษาอังกฤษ</option>
  </select>

  <dl>
    <dt>ฐานคำแปล</dt><dd id="version">–</dd>
    <dt>จำนวน</dt><dd id="count">–</dd>
    <dt>เช็กล่าสุด</dt><dd id="checked">–</dd>
  </dl>
  <button id="sync">อัปเดตตอนนี้</button>
  <div id="msg"></div>
  <footer>โปรเจกต์แฟน ไม่เกี่ยวข้องกับ Konami · คำแปลไม่ใช่ข้อความทางการ ·
    <a href="https://github.com/prachpawee-tang/ygo-th" target="_blank" rel="noopener noreferrer">GitHub</a></footer>
  <script src="popup.js"></script>
</body>
</html>
