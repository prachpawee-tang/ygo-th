name: validate
on:
  pull_request:
    paths: ["data/**", "tools/**"]
  push:
    branches: [main]
    paths: ["data/**", "tools/**"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test tools/tools.test.mjs   # parsers + safety checks (no data/ needed, ~1 s)
      - run: node tools/validate.mjs
      - run: node tools/build.mjs   # unsigned preview build — proves the data builds
