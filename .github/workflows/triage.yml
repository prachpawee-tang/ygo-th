name: triage
# Deterministic checks on translation issues. No AI, no repository write access.
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: read
  issues: write

concurrency:
  group: triage-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    if: contains(github.event.issue.labels.*.name, 'fix-translation') && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The issue text is read by the script from the event file — never interpolated into this YAML/shell.
      - run: node tools/triage.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
